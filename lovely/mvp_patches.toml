# Moar Vanilla Please - lovely patches (the interest step)
#
# Vanilla hardcodes the $5 interest step in FOUR inline spots: the payout, the round-eval
# row, the shop indicator's "per $5" label, and - easy to miss - the `dollars >= 5` gate that
# decides whether the interest row is drawn at all. There is no SMODS/Lua seam for any of
# them, so the literals have to be patched.
#
# UNIVERSAL, NOT DIAMOND-SPECIFIC. These no longer test for a stake. They route through
# MVP.interest_step() and MVP.interest_payout(), which read G.GAME.interest_step - a plain
# number any mod may set. A mod wanting interest per $N sets that field and these five sites
# follow it; nothing needs to know about Diamond, and Diamond is just the first caller.
#
# They are also UNGATED, which is safe because MVP.interest_payout() collapses to vanilla's
# own expression exactly when the step is 5. A run with no interest mod loaded is byte-for-
# byte vanilla by arithmetic rather than by branch.
#
# NB: lovely re-patches from the INSTALLED copy at game launch - a running game must be
# restarted for this to take effect.

[manifest]
version = "1.0.0"
priority = 10

# --- payout (state_events.lua) ---
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = 'dollars = dollars \+ G\.GAME\.interest_amount\*math\.min\(math\.floor\(G\.GAME\.dollars/5\), G\.GAME\.interest_cap/5\)'
position = "at"
payload = 'dollars = dollars + MVP.interest_payout()'

# --- round-eval interest row (state_events.lua) ---
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = "dollars = G\\.GAME\\.interest_amount\\*math\\.min\\(math\\.floor\\(G\\.GAME\\.dollars/5\\), G\\.GAME\\.interest_cap/5\\)\\}\\)"
position = "at"
payload = "dollars = MVP.interest_payout()})"

# --- interest row VISIBILITY gate (state_events.lua) ---
# `if G.GAME.dollars >= 5` decides whether the interest row is drawn on the round-eval
# screen. In vanilla that 5 matches the divisor, so the row can never show a zero. With the
# divisor moved and this gate left at 5, holding $5 or $6 on a $7 step passes the gate and
# then pays math.floor(5/7) = 0 - the round eval renders "$0  1 interest per $7". The gate
# moves with the step so the row appears only when it is actually worth something.
#
# \b before "if" is load-bearing. Without it this pattern matches the "if" tail of an
# "elseif" (e.g. Cryptid's own interest patch), and position="at" then replaces only that
# tail - turning a balanced "elseif ... then" into "else if ... then", which needs a second
# "end" nothing supplies. Balatro then fails to parse with "'end' expected ... near <eof>".
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '\bif G\.GAME\.dollars >= 5 and not G\.GAME\.modifiers\.no_interest then'
position = "at"
payload = 'if G.GAME.dollars >= MVP.interest_step() and not G.GAME.modifiers.no_interest then'

# --- "reached interest cap" streak check (state_events.lua) ---
[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = '\bif G\.GAME\.interest_amount\*math\.min\(math\.floor\(G\.GAME\.dollars/5\), G\.GAME\.interest_cap/5\) =='
position = "at"
payload = 'if MVP.interest_payout() =='

# --- shop interest indicator "per $5" -> "per $<step>" (common_events.lua) ---
# Only the BASE rate is labelled here. A run holding To the Moon still reads "2 interest per
# $7" while the second point is actually paid per $5 - the label has one step to show and the
# payout has two. Called out rather than papered over; the number paid is the correct one.
[[patches]]
[patches.regex]
target = "functions/common_events.lua"
pattern = "key = 'interest', vars = \\{G\\.GAME\\.interest_amount, 5, G\\.GAME\\.interest_amount\\*G\\.GAME\\.interest_cap/5\\}"
position = "at"
payload = "key = 'interest', vars = {G.GAME.interest_amount, MVP.interest_step(), G.GAME.interest_amount*G.GAME.interest_cap/5}"

[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = "local blind_amt = get_blind_amount\\(G\\.GAME\\.round_resets\\.blind_ante\\)\\*blind_choice\\.config\\.mult\\*G\\.GAME\\.starting_params\\.ante_scaling"
position = "at"
payload = "local blind_amt = get_blind_amount(G.GAME.round_resets.blind_ante)*blind_choice.config.mult*G.GAME.starting_params.ante_scaling*((G.GAME.modifiers and G.GAME.modifiers.mvp_mut_mercy and type == 'Boss') and 0.5 or 1)"
